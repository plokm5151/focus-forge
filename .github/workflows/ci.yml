# ============================================================================
# Brain Maintenance Dashboard - CI/CD Pipeline
# Matrix build across Ubuntu, Windows, and macOS with Qt6
# ============================================================================

name: CI - Build Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.7.0"

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install Qt6 ----
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtshadertools"
          cache: true

      # ---- Install GCC 13 (Ubuntu only) ----
      - name: Install GCC 13
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      # ---- Configure CMake ----
      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      # ---- Build ----
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # ---- Upload Artifacts ----
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brain-maintenance-dashboard-${{ matrix.os }}
          path: build/
          retention-days: 7
